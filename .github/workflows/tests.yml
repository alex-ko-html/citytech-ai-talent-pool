# Runs the tests on every code change, so edits to the rules can't silently break the monthly job.
name: Tests
on:
  push:
    paths-ignore: ["output/**", "docs/data/**", "data/**", "inbox/**", "*.md"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
