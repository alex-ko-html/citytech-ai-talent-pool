# Twice a year (start of each semester) opens a short checklist issue for the maintainer.
name: Semester checklist
on:
  schedule:
    - cron: "0 13 20 1,8 *"   # Jan 20 and Aug 20
  workflow_dispatch:
permissions:
  issues: write
jobs:
  remind:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Semester checklist ($(date -u +'%B %Y'))" \
            --body "- [ ] Open the dashboard: does each department show its new hires? (The faculty list updates itself from the directories.)
          - [ ] Download the Excel and work through the *Items To Check* tab; upload it back
          - [ ] Read the last monthly report's warnings (output/run_report.md)
          - [ ] Check OWNERS.md is still accurate (maintainer, backup, sponsor)
          - [ ] Confirm the OpenAlex API key secret still works (MAINTAINING.md section 3)

          Details: MAINTAINING.md → Every semester."
