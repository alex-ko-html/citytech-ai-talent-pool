# Twice a year, opens an issue reminding the maintainer to refresh the faculty roster
# (new hires and departures happen at semester start) and to confirm who owns the project.
name: Roster refresh reminder
on:
  schedule:
    - cron: "0 13 20 1,8 *"   # Jan 20 and Aug 20
  workflow_dispatch:
permissions:
  issues: write
jobs:
  remind:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Semester checklist: refresh the roster ($(date -u +'%B %Y'))" \
            --body "- [ ] Save the current department directory pages (full-time + adjunct tabs) as PDFs
          - [ ] Run \`python tools/build_roster.py path/to/pdfs\` and commit the new roster.csv
          - [ ] Look at last month's report for \"Not on roster yet\" people and confirm their departments
          - [ ] Check OWNERS.md is still accurate (maintainer, backup, sponsor)
          - [ ] Confirm the OpenAlex API key in Settings → Secrets still works (see MAINTAINING.md)

          Full steps: MAINTAINING.md → Every semester."
