# Rebuilds everything on the 1st of every month: faculty list, items, Excel workbook, dashboard.
# See MAINTAINING.md. Failures and anything needing a person open a GitHub issue.
name: Monthly AI talent pool update

on:
  schedule:
    - cron: "0 11 1 * *"     # 1st of every month, 11:00 UTC (7am New York)
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the safety checks object (only after reading the report)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: talent-pool-data        # never two updates at once (uploads also trigger this job)
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      - name: Run tests first (stops here if a code change broke something)
        run: python -m pytest -q tests

      - name: Rebuild the talent pool
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}   # optional, free at openalex.org/settings/api
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python -m talentpool ${{ inputs.force && '--force' || '' }}

      - name: Save results (also saves the report when a run is refused, which keeps the schedule alive)
        if: always()
        run: |
          git config user.name  "talent-pool-bot"
          git config user.email "talent-pool-bot@users.noreply.github.com"
          git add output docs/data data 2>/dev/null || true
          git commit -m "Monthly update $(date -u +%Y-%m-%d) (${{ job.status }})" || echo "Nothing to commit"
          git pull --rebase -q || true
          git push || echo "Push failed"

      - name: Open a review issue if anything changed or needs a person
        if: success() && github.event_name == 'schedule'
        run: |
          if python -c "import json,sys; sys.exit(0 if json.load(open('output/run_report.json'))['attention'] else 1)"; then
            gh issue create --title "Talent pool review: $(date -u +'%B %Y')" \
              --body "$(cat output/run_report.md; echo; echo "Run: $RUN_URL")"
          fi

      - name: Open (or update) a failure issue
        if: failure()
        run: |
          body="The update failed on $(date -u +%Y-%m-%d). Run log: $RUN_URL

          Last month's data is still live; nothing was overwritten. See MAINTAINING.md → Troubleshooting.

          $( [ -f output/run_report.md ] && cat output/run_report.md )"
          n=$(gh issue list --state open --search 'in:title "Monthly update failed"' --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "Monthly update failed" --body "$body"; fi
